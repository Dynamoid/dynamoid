RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/SpecFilePathSuffix:
  Exclude:
    - 'spec/README.md'
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/InstanceVariable:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/ExpectInHook:
  Enabled: false
RSpec/DescribeClass:
  Exclude:
    - 'spec/examples/*'
    - 'spec/integration/*'
    - 'spec/system/*'
    - 'spec/e2e/*'
RSpec/NoExpectationExample:
  Exclude:
    - 'spec/README.md'
RSpec/MultipleDescribes:
  Exclude:
    - 'spec/README.md'
RSpec/RepeatedExampleGroupDescription:
  Exclude:
    - 'spec/README.md'

RSpec/ExpectInLet:
  Enabled: false

# NOTE: for many tests of equality `eql` works, while `be` does not, because
#        expected #<Fixnum:...> => 101
#            got #<BigDecimal:...> => 101.0 (0.101e3)
RSpec/BeEql:
  Enabled: false

RSpec/BeEq:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

# Disable while callbacks specs use printing into output
RSpec/Output:
  Exclude:
    - 'spec/support/**/*'
    - 'spec/config/**/*'
    - 'spec/fixtures/**/*'
  Enabled: false
