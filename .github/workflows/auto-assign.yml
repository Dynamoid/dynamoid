name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@bec9ebf443592887b8f9bed643afafdfd3f62f1d # v4.0.2
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: "pboling"
          abortIfPreviousAssignees: true
          allowSelfAssign: true
          numOfAssignee: 1
